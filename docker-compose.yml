services:
  db:
    image: mongo:7.0.16
    container_name: kandz-mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/test | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    image: kandz-backend-fastapi:v1.0
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: kandz-backend-fastapi
    restart: unless-stopped
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://db:27017/}
      DATABASE_NAME: ${DATABASE_NAME:-kandz}
      ADMIN_TOKEN_SECRET: ${ADMIN_TOKEN_SECRET:-kanji-lookup-dev-secret}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  frontend:
    image: kandz-frontend-nginx-react:v1.0
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: kandz-frontend-nginx-react
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  mongo_data:
  mongo_config:
